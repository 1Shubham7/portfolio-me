baseURL: "https://1shubham7.netlify.app"
languageCode: en-us
title: Shubham Singh
theme: PaperMod

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: experience
      name: Experience
      url: /experience
      weight: 20
    - identifier: blog
      name: Blog
      url: /blog
      weight: 30
    - identifier: search
      name: Search
      url: /search
      weight: 60

params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production

  # Home Page
  profileMode:
    enabled: true
    title: "Shubham Singh"
    subtitle: |
      Hi there 👋, I'm Shubham. I'm an SRE at Obmondo, running Kubernetes clusters and building developer tools, and I write about open source, cloud native things and AI here. I'm a Certified Kubernetes Administrator and a graduated LFX mentee with CNCF KubeEdge, and I've been contributing to open source and the cloud native ecosystem for about three years.

      I love talking about open source, cloud native, Kubernetes, AI and compliance, so you'll find me at various tech conferences and on YouTube. Over the last two years I've also helped organisations build and audit infrastructure against global security and compliance standards, so expect opinions on compliance here too.
    imageUrl: "home/shubham.jpeg"
    imageWidth: 250
    imageHeight: 250
    # buttons:
    #   - name: Resume
    #     url: ""

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:    
    - name: "github"
      url: "https://github.com/1shubham7"
    - name: "email"
      url: "mailto:shubhammahar1306@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/1shubham7"
    - name: "twitter"
      url: "https://www.twitter.com/1shubham7"
    - name: "youtube"
      url: "https://www.youtube.com/@pea-shooter17"
    - name: "cv"
      url: "https://drive.google.com/drive/folders/1mRPog7EB6S5yGrWecFMQxaDnYqXC_reK"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MarkDown
markup:
  goldmark:
    renderer:
      unsafe: true
